name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHON: python
      TRACEDOCK_PYTHON: python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Check strict TypeScript contracts
        timeout-minutes: 3
        run: npm run typecheck
      - name: Run unit and integration regressions
        timeout-minutes: 5
        run: npm test
      - name: Verify desktop recording and exports
        timeout-minutes: 5
        run: npm run test:smoke
      - name: Verify offline replay
        timeout-minutes: 3
        run: npm run test:replay
      - name: Verify cross-page resource ownership
        timeout-minutes: 3
        run: npm run test:resource-navigation
      - name: Verify background export cancellation
        timeout-minutes: 5
        run: npm run test:export-desktop
      - name: Build Windows portable application
        timeout-minutes: 10
        run: npm run build -- --publish never
      - name: Verify native portable application
        timeout-minutes: 5
        run: npm run test:portable
      - name: Verify 1 GiB recording export and restoration
        timeout-minutes: 25
        run: npm run test:large
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-verification-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/playwright/*.json
            output/playwright/*.png
            output/playwright/*.log
            output/replay-smoke-*/report.json
            output/replay-smoke-*/offline-replay.png
            output/resource-navigation-smoke-*/report.json
            output/export-desktop-*/summary.json
            output/large-recording-*/report-*.json
      - name: Upload verified portable application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TraceDock-Windows-x64
          retention-days: 7
          if-no-files-found: error
          path: dist/TraceDock-*-Windows-x64.exe
